<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กระปุกเงินนักเรียน - จัดการเงินส่วนบุคคล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Kanit', sans-serif;
        }
        
        .water {
            fill: url(#waterGradient);
            transition: all 0.8s ease;
        }
        
        /* GSAP-enhanced flowing animations */
        .income-flow {
            stroke-dasharray: 10 5;
        }
        
        .expense-flow {
            stroke-dasharray: 8 4;
        }
        
        .arrow-element {
            transform-origin: center;
        }
        
        .label-element {
            transform-origin: center;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-800 mb-2">💰 กระปุกเงินนักเรียน</h1>
            <p class="text-gray-600">จัดการเงินส่วนบุคคลแบบง่ายๆ พัฒนาโดย ครูจิรัฎฐ์ สุดใจ</p>
            <div class="mt-4 flex justify-center items-center space-x-2">
                <label for="studentName" class="text-indigo-700 font-medium">ชื่อนักเรียน:</label>
                <input id="studentName" type="text" class="px-3 py-2 border border-indigo-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-indigo-800 font-medium" style="min-width:120px;" placeholder="กรอกชื่อ...">
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 gap-6 max-w-6xl mx-auto">
            
            <!-- Water Jar Visualization -->
            <div class="bg-white rounded-2xl shadow-xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-800">สถานะกระปุกเงิน</h2>
                    
                    <!-- Period Selector -->
                    <div class="bg-gray-100 rounded-lg p-1">
                        <button id="monthlyBtn" class="px-4 py-2 rounded-md text-sm font-medium transition-colors bg-indigo-500 text-white">รายเดือน</button>
                        <button id="weeklyBtn" class="px-4 py-2 rounded-md text-sm font-medium transition-colors text-gray-600 hover:text-indigo-600">รายสัปดาห์</button>

                    </div>
                </div>

                <!-- Water Jar SVG -->
                <div class="flex justify-center relative">
                    <svg width="700" height="480" viewBox="0 0 700 480" class="max-w-full">
                        <!-- Gradient Definitions -->
                        <defs>
                            <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.9" />
                                <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:0.95" />
                                <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="jarInnerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#E9ECEF;stop-opacity:1" />
                            </linearGradient>
                            <pattern id="waterPattern" patternUnits="userSpaceOnUse" width="40" height="40">
                                <circle cx="20" cy="20" r="2" fill="#FFFFFF" opacity="0.3">
                                    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
                                </circle>
                                <circle cx="10" cy="30" r="1.5" fill="#FFFFFF" opacity="0.2">
                                    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2.5s" repeatCount="indefinite"/>
                                </circle>
                                <circle cx="30" cy="10" r="1" fill="#FFFFFF" opacity="0.4">
                                    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
                                </circle>
                            </pattern>
                        </defs>
                        
                        <!-- Income Arrows with Labels -->
                        <g id="incomeArrows">
                            <!-- Income arrows will be dynamically added here -->
                        </g>
                        
                        <!-- Traditional Thai Jar Shape -->
                        <!-- Jar Body (wider at middle, narrower at top and bottom) -->
                        <path d="M280 120 Q260 120 250 140 L240 180 Q235 220 240 260 Q245 300 270 320 L430 320 Q455 300 460 260 Q465 220 460 180 L450 140 Q440 120 420 120 Z" 
                              fill="#D4A574" stroke="#B8956A" stroke-width="3"/>
                        
                        <!-- Jar Neck -->
                        <ellipse cx="350" cy="120" rx="30" ry="8" fill="#D4A574" stroke="#B8956A" stroke-width="2"/>
                        <rect x="320" y="112" width="60" height="16" fill="#D4A574"/>
                        
                        <!-- Jar Rim -->
                        <ellipse cx="350" cy="112" rx="35" ry="10" fill="#E8C49A" stroke="#B8956A" stroke-width="2"/>
                        
                        <!-- Jar Inner Shadow -->
                        <path d="M285 125 Q265 125 255 145 L245 185 Q240 225 245 265 Q250 295 275 315 L425 315 Q450 295 455 265 Q460 225 455 185 L445 145 Q435 125 415 125 Z" 
                              fill="url(#jarInnerGradient)" stroke="none"/>
                        
                        <!-- Jar Texture Lines -->
                        <path d="M250 160 Q350 155 450 160" stroke="#B8956A" stroke-width="1" fill="none" opacity="0.5"/>
                        <path d="M245 200 Q350 195 455 200" stroke="#B8956A" stroke-width="1" fill="none" opacity="0.5"/>
                        <path d="M240 240 Q350 235 460 240" stroke="#B8956A" stroke-width="1" fill="none" opacity="0.5"/>
                        <path d="M245 280 Q350 275 455 280" stroke="#B8956A" stroke-width="1" fill="none" opacity="0.5"/>
                        
                        <!-- Water Level -->
                        <path id="waterLevel" d="M250 310 Q350 305 450 310 L430 315 L270 315 Q250 315 250 310 Z" 
                              class="water"/>
                        
                        <!-- Water Pattern Overlay -->
                        <path id="waterPattern" d="M250 310 Q350 305 450 310 L430 315 L270 315 Q250 315 250 310 Z" 
                              fill="url(#waterPattern)" opacity="0.6"/>
                        
                        <!-- Balance Display in Jar -->
                        <text id="jarBalance" x="350" y="240" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E40AF">฿0</text>
                        <text id="jarPercentage" x="350" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#3B82F6">0%</text>
                        
                        <!-- Expense Arrows with Labels -->
                        <g id="expenseArrows">
                            <!-- Expense arrows will be dynamically added here -->
                        </g>
                    </svg>
                </div>

                <!-- Status Display -->
                <div class="grid grid-cols-3 gap-4 mt-6">
                    <div class="bg-green-50 p-4 rounded-lg border border-green-200">
                        <div class="text-center">
                            <div class="text-lg mb-1">💧</div>
                            <div class="text-green-700 text-sm font-medium mb-1">รายรับทั้งหมด</div>
                            <div id="totalIncome" class="text-lg font-bold text-green-800">฿0</div>
                        </div>
                    </div>
                    <div class="bg-red-50 p-4 rounded-lg border border-red-200">
                        <div class="text-center">
                            <div class="text-lg mb-1">💸</div>
                            <div class="text-red-700 text-sm font-medium mb-1">รายจ่ายทั้งหมด</div>
                            <div id="totalExpense" class="text-lg font-bold text-red-800">฿0</div>
                        </div>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                        <div class="text-center">
                            <div class="text-lg mb-1">🏺</div>
                            <div class="text-blue-700 text-sm font-medium mb-1">ยอดคงเหลือ</div>
                            <div id="balance" class="text-lg font-bold text-blue-800">฿0</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Income and Expense Management -->
            <div class="grid lg:grid-cols-2 gap-6">

                <!-- Income Management -->
                <div class="bg-white rounded-2xl shadow-xl p-6">
                    <h2 class="text-xl font-semibold mb-4 text-green-700 flex items-center">
                        💰 รายรับ
                    </h2>
                    
                    <!-- Add Income Form -->
                    <div class="mb-4 p-4 bg-green-50 rounded-lg">
                        <h3 class="font-medium mb-3 text-green-800">เพิ่มรายรับใหม่</h3>
                        <div class="space-y-3">
                            <input type="text" id="incomeDesc" placeholder="รายละเอียด (เช่น เงินเดือน, เงินพิเศษ)" 
                                   class="w-full p-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                            <select id="incomeCategory" class="w-full p-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                                <option value="salary">💼 เงินเดือน</option>
                                <option value="business">🏢 ธุรกิจ</option>
                                <option value="investment">📈 การลงทุน</option>
                                <option value="freelance">💻 งานฟรีแลนซ์</option>
                                <option value="bonus">🎁 โบนัส</option>
                                <option value="gift">💝 ของขวัญ</option>
                                <option value="other">💰 อื่นๆ</option>
                            </select>
                            <input type="number" id="incomeAmount" placeholder="จำนวนเงิน" 
                                   class="w-full p-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                            <button onclick="addIncome()" class="w-full bg-green-500 text-white py-3 rounded-lg hover:bg-green-600 transition-colors font-medium">
                                ➕ เพิ่มรายรับ
                            </button>
                        </div>
                    </div>

                    <!-- Income List -->
                    <div id="incomeList" class="space-y-2 max-h-48 overflow-y-auto">
                        <!-- Income items will be added here -->
                    </div>
                </div>

                <!-- Expense Management -->
                <div class="bg-white rounded-2xl shadow-xl p-6">
                    <h2 class="text-xl font-semibold mb-4 text-red-700 flex items-center">
                        💸 รายจ่าย
                    </h2>
                    
                    <!-- Add Expense Form -->
                    <div class="mb-4 p-4 bg-red-50 rounded-lg">
                        <h3 class="font-medium mb-3 text-red-800">เพิ่มรายจ่ายใหม่</h3>
                        <div class="space-y-3">
                            <input type="text" id="expenseDesc" placeholder="รายละเอียด (เช่น ค่าอาหาร, ค่าผ่อน)" 
                                   class="w-full p-3 border border-red-200 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent">
                            <select id="expenseCategory" class="w-full p-3 border border-red-200 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent">
                                <option value="food">🍽️ อาหาร</option>
                                <option value="transport">🚗 ค่าเดินทาง</option>
                                <option value="entertainment">🎮 ความบันเทิง</option>
                                <option value="education">📚 การศึกษา</option>
                                <option value="health">🏥 สุขภาพ</option>
                                <option value="debt">💳 ค่าผ่อน/หนี้</option>
                                <option value="other">💸 อื่นๆ</option>
                            </select>
                            <input type="number" id="expenseAmount" placeholder="จำนวนเงิน" 
                                   class="w-full p-3 border border-red-200 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent">
                            <button onclick="addExpense()" class="w-full bg-red-500 text-white py-3 rounded-lg hover:bg-red-600 transition-colors font-medium">
                                ➕ เพิ่มรายจ่าย
                            </button>
                        </div>
                    </div>

                    <!-- Expense List -->
                    <div id="expenseList" class="space-y-2 max-h-48 overflow-y-auto">
                        <!-- Expense items will be added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JSON Data Viewer/Editor -->
    <div class="container mx-auto px-4 py-6">
        <div class="bg-gray-50 border border-gray-200 rounded-xl p-6 shadow-md">
            <h2 class="text-lg font-bold text-gray-700 mb-2 flex items-center">
                <i class="fas fa-database mr-2"></i> ข้อมูลนักเรียน (JSON)
            </h2>
            <textarea id="jsonDataBox" class="w-full h-48 p-3 border border-gray-300 rounded-lg font-mono text-xs bg-white mb-3" spellcheck="false"></textarea>
            <div class="flex justify-end">
                <button onclick="copyJsonData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition">คัดลอก JSON</button>
            </div>
        </div>
    </div>

    <script>
        // Data storage using localStorage (JSONP-like local storage)
        let currentPeriod = 'monthly'; // Default to monthly
        let data = {
            studentName: '',
            weekly: { income: [], expenses: [] },
            monthly: { income: [], expenses: [] }
        };

        // Load data from localStorage
        function loadData() {
            const savedData = localStorage.getItem('moneyJarData');
            if (savedData) {
                data = JSON.parse(savedData);
            }
            // Set student name input
            document.getElementById('studentName').value = data.studentName || '';
        }

        // Save data to localStorage
        function saveData() {
            localStorage.setItem('moneyJarData', JSON.stringify(data));
            updateJsonBox();
            syncDataToUrl();
        }

        // Base64 encode/decode helpers
        function encodeBase64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }
        function decodeBase64(str) {
            try {
                return decodeURIComponent(escape(atob(str)));
            } catch (e) {
                return '';
            }
        }

        // Sync data to URL
        function syncDataToUrl() {
            const jsonStr = JSON.stringify(data);
            const base64 = encodeBase64(jsonStr);
            const url = new URL(window.location.href);
            url.searchParams.set('data', base64);
            history.replaceState(null, '', url.toString());
        }

        // Load data from URL if present
        function loadDataFromUrl() {
            const url = new URL(window.location.href);
            const base64 = url.searchParams.get('data');
            if (base64) {
                try {
                    const jsonStr = decodeBase64(base64);
                    const newData = JSON.parse(jsonStr);
                    data = newData;
                } catch (e) {
                    // ignore if invalid
                }
            }
        }

        // Update student name in data and header
        document.getElementById('studentName').addEventListener('input', function() {
            data.studentName = this.value;
            saveData();
            updateStudentNameHeader();
        });

        function updateStudentNameHeader() {
            // Show name in header (if needed, e.g. in jar or title)
            // Example: update jar label
            let jarLabel = document.getElementById('jarStudentName');
            if (!jarLabel) {
                jarLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                jarLabel.setAttribute('id', 'jarStudentName');
                jarLabel.setAttribute('x', '350');
                jarLabel.setAttribute('y', '280');
                jarLabel.setAttribute('text-anchor', 'middle');
                jarLabel.setAttribute('font-size', '16');
                jarLabel.setAttribute('font-weight', 'bold');
                jarLabel.setAttribute('fill', '#6366F1');
                document.querySelector('svg').appendChild(jarLabel);
            }
            jarLabel.textContent = data.studentName ? data.studentName : '';
        }

        // Initialize app
        function init() {
            loadData();
            // Set button styles for default period
            document.getElementById('monthlyBtn').className = 'px-4 py-2 rounded-md text-sm font-medium transition-colors bg-indigo-500 text-white';
            document.getElementById('weeklyBtn').className = 'px-4 py-2 rounded-md text-sm font-medium transition-colors text-gray-600 hover:text-indigo-600';
            updateDisplay();
            updateWaterLevel();
        }

        // Period switching
        document.getElementById('weeklyBtn').addEventListener('click', () => {
            currentPeriod = 'weekly';
            document.getElementById('weeklyBtn').className = 'px-4 py-2 rounded-md text-sm font-medium transition-colors bg-indigo-500 text-white';
            document.getElementById('monthlyBtn').className = 'px-4 py-2 rounded-md text-sm font-medium transition-colors text-gray-600 hover:text-indigo-600';
            updateDisplay();
            updateWaterLevel();
        });

        document.getElementById('monthlyBtn').addEventListener('click', () => {
            currentPeriod = 'monthly';
            document.getElementById('monthlyBtn').className = 'px-4 py-2 rounded-md text-sm font-medium transition-colors bg-indigo-500 text-white';
            document.getElementById('weeklyBtn').className = 'px-4 py-2 rounded-md text-sm font-medium transition-colors text-gray-600 hover:text-indigo-600';
            updateDisplay();
            updateWaterLevel();
        });

        // Add income
        function addIncome() {
            const desc = document.getElementById('incomeDesc').value.trim();
            const category = document.getElementById('incomeCategory').value;
            const amount = parseFloat(document.getElementById('incomeAmount').value);
            
            if (!desc || !amount || amount <= 0) {
                Swal.fire({
                    icon: 'error',
                    title: 'กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้อง',
                    showConfirmButton: true,
                    timer: 1500
                });
                return;
            }

            const income = {
                id: Date.now(),
                description: desc,
                category: category,
                amount: amount,
                date: new Date().toLocaleDateString('th-TH')
            };

            data[currentPeriod].income.push(income);
            saveData();
            
            // Clear form
            document.getElementById('incomeDesc').value = '';
            document.getElementById('incomeCategory').value = 'freelance';
            document.getElementById('incomeAmount').value = '';
            
            updateDisplay();
            updateWaterLevel();
        }

        // Add expense
        function addExpense() {
            const desc = document.getElementById('expenseDesc').value.trim();
            const category = document.getElementById('expenseCategory').value;
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            
            if (!desc || !amount || amount <= 0) {
                Swal.fire({
                    icon: 'error',
                    title: 'กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้อง',
                    showConfirmButton: true,
                    timer: 1500
                });
                return;
            }

            const expense = {
                id: Date.now(),
                description: desc,
                category: category,
                amount: amount,
                date: new Date().toLocaleDateString('th-TH')
            };

            data[currentPeriod].expenses.push(expense);
            saveData();
            
            // Clear form
            document.getElementById('expenseDesc').value = '';
            document.getElementById('expenseCategory').value = 'food';
            document.getElementById('expenseAmount').value = '';
            
            updateDisplay();
            updateWaterLevel();
        }

        // Delete income
        function deleteIncome(id) {
            data[currentPeriod].income = data[currentPeriod].income.filter(item => item.id !== id);
            saveData();
            updateDisplay();
            updateWaterLevel();
        }

        // Delete expense
        function deleteExpense(id) {
            data[currentPeriod].expenses = data[currentPeriod].expenses.filter(item => item.id !== id);
            saveData();
            updateDisplay();
            updateWaterLevel();
        }

        // Update display
        function updateDisplay() {
            const currentData = data[currentPeriod];
            
            // Update totals
            const totalIncome = currentData.income.reduce((sum, item) => sum + item.amount, 0);
            const totalExpense = currentData.expenses.reduce((sum, item) => sum + item.amount, 0);
            const balance = totalIncome - totalExpense;

            document.getElementById('totalIncome').textContent = `฿${totalIncome.toLocaleString()}`;
            document.getElementById('totalExpense').textContent = `฿${totalExpense.toLocaleString()}`;
            document.getElementById('balance').textContent = `฿${balance.toLocaleString()}`;

            // Update income list
            const incomeList = document.getElementById('incomeList');
            incomeList.innerHTML = '';
            currentData.income.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-3 bg-green-50 rounded-lg border border-green-200';
                
                const categoryIcons = {
                    'salary': '💼',
                    'business': '🏢',
                    'investment': '📈',
                    'freelance': '💻',
                    'bonus': '🎁',
                    'gift': '💝',
                    'other': '💰'
                };
                
                const categoryNames = {
                    'salary': 'เงินเดือน',
                    'business': 'ธุรกิจ',
                    'investment': 'การลงทุน',
                    'freelance': 'งานฟรีแลนซ์',
                    'bonus': 'โบนัส',
                    'gift': 'ของขวัญ',
                    'other': 'อื่นๆ'
                };
                
                const icon = categoryIcons[item.category] || categoryIcons['other'];
                const categoryName = categoryNames[item.category] || categoryNames['other'];
                
                div.innerHTML = `
                    <div>
                        <div class="font-medium text-green-800">${icon} ${item.description}</div>
                        <div class="text-sm text-green-600">${item.date} (${categoryName})</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-semibold text-green-700">฿${item.amount.toLocaleString()}</span>
                        <button onclick="deleteIncome(${item.id})" class="text-red-500 hover:text-red-700 text-sm">🗑️</button>
                    </div>
                `;
                incomeList.appendChild(div);
            });

            // Update expense list
            const expenseList = document.getElementById('expenseList');
            expenseList.innerHTML = '';
            currentData.expenses.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-3 bg-red-50 rounded-lg border border-red-200';
                
                const categoryIcons = {
                    'food': '🍽️',
                    'transport': '🚗', 
                    'entertainment': '🎮',
                    'education': '📚',
                    'health': '🏥',
                    'debt': '💳',
                    'other': '💸'
                };
                
                const categoryNames = {
                    'food': 'อาหาร',
                    'transport': 'ค่าเดินทาง', 
                    'entertainment': 'ความบันเทิง',
                    'education': 'การศึกษา',
                    'health': 'สุขภาพ',
                    'debt': 'ค่าผ่อน/หนี้',
                    'other': 'อื่นๆ'
                };
                
                const icon = categoryIcons[item.category] || categoryIcons['other'];
                const categoryName = categoryNames[item.category] || categoryNames['other'];
                
                div.innerHTML = `
                    <div>
                        <div class="font-medium text-red-800">${icon} ${item.description}</div>
                        <div class="text-sm text-red-600">${item.date} (${categoryName})</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-semibold text-red-700">฿${item.amount.toLocaleString()}</span>
                        <button onclick="deleteExpense(${item.id})" class="text-red-500 hover:text-red-700 text-sm">🗑️</button>
                    </div>
                `;
                expenseList.appendChild(div);
            });
            updateJsonBox();
            updateStudentNameHeader();
            syncDataToUrl();
        }

        // Update water level visualization
        function updateWaterLevel() {
            const currentData = data[currentPeriod];
            const totalIncome = currentData.income.reduce((sum, item) => sum + item.amount, 0);
            const totalExpense = currentData.expenses.reduce((sum, item) => sum + item.amount, 0);
            const balance = totalIncome - totalExpense;
            
            // คำนวณเปอร์เซ็นต์จากรายรับ (ถ้ามีรายรับ 1000 และเหลือ 1000 = 100%)
            const percentage = totalIncome > 0 ? Math.round((balance / totalIncome) * 100) : 0;
            
            // กระปุกมีความสูงจริง 185 pixels (จาก y=130 ถึง y=315)
            const jarInnerHeight = 185; // ความสูงภายในกระปุก
            const jarBottom = 315; // ก้นกระปุกจริง
            
            // คำนวณความสูงน้ำ - 100% = เต็มกระปุกจริงๆ
            const waterHeightPercent = Math.max(0, Math.min(100, percentage));
            const waterHeight = (waterHeightPercent / 100) * jarInnerHeight;
            const waterY = jarBottom - waterHeight;
            
            // Update water level path
            const waterLevel = document.getElementById('waterLevel');
            const waterPattern = document.getElementById('waterPattern');
            
            if (balance > 0 && waterHeight > 5) {
                // น้ำมีรูปร่างเดิมเสมอ แค่ครอปตามระดับ
                // รูปร่างน้ำเต็มกระปุก (รูปร่างคงที่)
                const fullWaterPath = `M245 275 Q350 270 455 275 Q450 295 425 310 L275 310 Q250 295 245 275 Z`;
                
                // ใช้ clipPath เพื่อครอปน้ำตามระดับ
                const clipId = 'waterClip';
                let clipPath = document.getElementById(clipId);
                if (!clipPath) {
                    // สร้าง clipPath ใหม่ถ้ายังไม่มี
                    const defs = document.querySelector('defs');
                    clipPath = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
                    clipPath.id = clipId;
                    defs.appendChild(clipPath);
                }
                
                // สร้าง rectangle สำหรับ clip ตามระดับน้ำ
                clipPath.innerHTML = `<rect x="240" y="${waterY}" width="220" height="${waterHeight + 5}"/>`;
                
                // ตั้งค่า path และ clip
                waterLevel.setAttribute('d', fullWaterPath);
                waterPattern.setAttribute('d', fullWaterPath);
                waterLevel.setAttribute('clip-path', `url(#${clipId})`);
                waterPattern.setAttribute('clip-path', `url(#${clipId})`);
                
                waterLevel.style.opacity = '1';
                waterPattern.style.opacity = '0.6';
                
                // GSAP animation for water
                gsap.to(waterLevel, {duration: 0.8, ease: "power2.out"});
            } else {
                waterLevel.style.opacity = '0';
                waterPattern.style.opacity = '0';
            }
            
            // Update jar display
            document.getElementById('jarBalance').textContent = `฿${balance.toLocaleString()}`;
            document.getElementById('jarPercentage').textContent = `${percentage}%`;
            
            // Update arrows
            updateIncomeArrows();
            updateExpenseArrows();
        }
